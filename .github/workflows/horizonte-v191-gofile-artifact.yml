name: Horizonte V191 Gofile Artifact Bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'horizonte-v191-gofile-trigger.txt'
      - '.github/workflows/horizonte-v191-gofile-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download GoFile helper
        run: |
          set -euo pipefail
          curl -fL --retry 3             https://raw.githubusercontent.com/martadams89/gofile-dl/main/run.py             -o /tmp/gofile_run.py
          python -m pip install --quiet requests pathvalidate curl_cffi

      - name: Download validated V1.9.1 APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/gofile-out /tmp/gofile-config
          CONFIG_DIR=/tmp/gofile-config python /tmp/gofile_run.py             "https://gofile.io/d/uNAmuqFq"             -d /tmp/gofile-out

          APK="$(find /tmp/gofile-out -type f -name 'Horizonte-Artificial-v1.9.1-PFD-test-debug.apk' -print -quit)"
          test -n "$APK"
          echo "4a9110a8e3004a2593314d5d78a5ec1a688ef89e73a0ac7d07f425d4cb67d6f5  $APK" | sha256sum -c -
          test "$(stat -c%s "$APK")" = "162179724"
          cp "$APK" ./Horizonte-Artificial-v1.9.1-PFD-test-debug.apk

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-Artificial-v1.9.1-PFD-test-debug
          path: Horizonte-Artificial-v1.9.1-PFD-test-debug.apk
          if-no-files-found: error
          retention-days: 1
