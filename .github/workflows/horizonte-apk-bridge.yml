name: Temporary Horizonte APK Bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'horizonte-apk-bridge-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download temporary APK
        run: |
          set -euo pipefail
          URL="https://store10.gofile.io/download/web/a25b5ec0-2005-4825-a21a-90993e559ed8/Horizonte-Artificial-v1.8.0-PFD-test-debug.apk"
          curl -fL --retry 3 "$URL" -o Horizonte-Artificial-v1.8.0-PFD-test-debug.apk
          test -s Horizonte-Artificial-v1.8.0-PFD-test-debug.apk
          sha256sum Horizonte-Artificial-v1.8.0-PFD-test-debug.apk

      - name: Publish temporary public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="horizonte-apk-bridge-${GITHUB_RUN_ID}"
          gh release create "$TAG" Horizonte-Artificial-v1.8.0-PFD-test-debug.apk             --repo "$GITHUB_REPOSITORY"             --title "Temporary Horizonte Artificial APK Bridge"             --notes "Temporary transport release. Will be removed after handoff."             --prerelease
