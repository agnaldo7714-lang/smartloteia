name: Cleanup Temporary Horizonte Handoff

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-horizonte-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary public releases and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "temp-horizonte-v1.8.0-handoff" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release delete "horizonte-apk-bridge-36082707882" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/10842506626" >/dev/null 2>&1 || true
