name: Horizonte V1111 Gofile Artifact Bridge

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/horizonte-v1111-gofile-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download GoFile helper
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/martadams89/gofile-dl/main/run.py \
            -o /tmp/gofile_run.py
          python -m pip install --quiet requests pathvalidate curl_cffi

      - name: Download validated V1.11.1 APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/gofile-out /tmp/gofile-config
          CONFIG_DIR=/tmp/gofile-config python /tmp/gofile_run.py \
            "https://gofile.io/d/AiKDxTHA" \
            -d /tmp/gofile-out

          APK="$(find /tmp/gofile-out -type f -name 'Horizonte-Artificial-v1.11.1-PFD-test-debug.apk' -print -quit)"
          test -n "$APK"
          echo "fa2bddbfc43ce8be57e5fd9a2350f6eb64d5e9616d5b57a6344808ede9bedacb  $APK" | sha256sum -c -
          test "$(stat -c%s "$APK")" = "162235384"
          cp "$APK" ./Horizonte-Artificial-v1.11.1-PFD-test-debug.apk

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-Artificial-v1.11.1-PFD-test-debug
          path: Horizonte-Artificial-v1.11.1-PFD-test-debug.apk
          if-no-files-found: error
          retention-days: 1
