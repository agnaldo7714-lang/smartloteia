name: Horizonte V181 Artifact Bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'horizonte-v181-artifact-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download corrected APK
        run: |
          set -euo pipefail
          curl -fL --retry 3             'https://cold-na-phx-5.gofile.io/download/direct/1e61a317-c21d-425f-b4dc-f2fa76aedf55/Horizonte-Artificial-v1.8.1-PFD-test-debug.apk'             -o Horizonte-Artificial-v1.8.1-PFD-test-debug.apk
          echo "0a3549f7a60824316108d596abe05682a0c4b964a99780870e8e8cfe2aeea47e  Horizonte-Artificial-v1.8.1-PFD-test-debug.apk" | sha256sum -c -
          test "$(stat -c%s Horizonte-Artificial-v1.8.1-PFD-test-debug.apk)" = "159827202"

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-Artificial-v1.8.1-PFD-test-debug
          path: Horizonte-Artificial-v1.8.1-PFD-test-debug.apk
          if-no-files-found: error
          retention-days: 1
