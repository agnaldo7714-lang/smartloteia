name: Cleanup Horizonte V1.8.1 Handoff

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-horizonte-v181.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary release and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "temp-horizonte-v1.8.1-handoff" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/10868619503" >/dev/null 2>&1 || true
