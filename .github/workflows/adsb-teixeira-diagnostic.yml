name: ADSB Teixeira Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsb-teixeira-diagnostic.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query sources
        shell: bash
        run: |
          LAT='-17.539'
          LON='-39.743'
          for R in 40 100; do
            echo "=== ADSB.LOL radius $R NM ==="
            curl -fsSL --max-time 15 -A 'HorizonteArtificial diagnostic' \
              "https://api.adsb.lol/v2/point/$LAT/$LON/$R" \
              -o /tmp/lol.json
            jq '{count:(.ac|length), aircraft:(.ac|map({hex,flight,lat,lon,alt_baro,gs,track,seen_pos,seen})|.[0:30])}' /tmp/lol.json

            echo "=== ADSB.FI radius $R NM ==="
            curl -fsSL --max-time 15 -A 'HorizonteArtificial diagnostic' \
              "https://opendata.adsb.fi/api/v3/lat/$LAT/lon/$LON/dist/$R" \
              -o /tmp/fi.json
            jq '{count:(.ac|length), aircraft:(.ac|map({hex,flight,lat,lon,alt_baro,gs,track,seen_pos,seen})|.[0:30])}' /tmp/fi.json
          done
