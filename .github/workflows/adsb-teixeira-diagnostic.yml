name: ADSB Teixeira Diagnostic

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/adsb-teixeira-diagnostic.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Compare ADS-B sources around Teixeira
        run: |
          set -euo pipefail
          LAT="-17.539"
          LON="-39.743"
          for R in 40 100; do
            for BASE in               "https://api.adsb.lol/v2/point"               "https://opendata.adsb.fi/api/v3/lat"
            do
              if [[ "$BASE" == *"adsb.lol"* ]]; then
                URL="$BASE/$LAT/$LON/$R"
              else
                URL="$BASE/$LAT/lon/$LON/dist/$R"
              fi
              echo "=== $URL ==="
              BODY="$(curl -fsSL --max-time 15 -A 'HorizonteArtificial diagnostic' -H 'Accept: application/json' "$URL")"
              python - "$BODY" <<'PY'
import json,sys
d=json.loads(sys.argv[1])
ac=d.get('ac') or []
print("count=",len(ac))
for x in ac[:30]:
    print({
      "hex":x.get("hex"),
      "flight":x.get("flight"),
      "lat":x.get("lat"),
      "lon":x.get("lon"),
      "alt_baro":x.get("alt_baro"),
      "gs":x.get("gs"),
      "track":x.get("track"),
      "seen_pos":x.get("seen_pos"),
      "seen":x.get("seen"),
    })
PY
            done
          done
