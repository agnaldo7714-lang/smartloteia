name: Horizonte V190 Gofile Artifact Bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'horizonte-v190-gofile-trigger.txt'
      - '.github/workflows/horizonte-v190-gofile-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download GoFile helper
        run: |
          set -euo pipefail
          curl -fL --retry 3             https://raw.githubusercontent.com/martadams89/gofile-dl/main/run.py             -o /tmp/gofile_run.py
          python -m pip install --quiet requests pathvalidate curl_cffi

      - name: Download validated V1.9 APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/gofile-out /tmp/gofile-config
          CONFIG_DIR=/tmp/gofile-config python /tmp/gofile_run.py             "https://gofile.io/d/QIZVUFds"             -d /tmp/gofile-out

          APK="$(find /tmp/gofile-out -type f -name 'Horizonte-Artificial-v1.9.0-PFD-test-debug.apk' -print -quit)"
          test -n "$APK"
          echo "87dc82dac24d53dd73c5749d52a37c9cb833bb029856feebdff7496d8388ed26  $APK" | sha256sum -c -
          cp "$APK" ./Horizonte-Artificial-v1.9.0-PFD-test-debug.apk

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-Artificial-v1.9.0-PFD-test-debug
          path: Horizonte-Artificial-v1.9.0-PFD-test-debug.apk
          if-no-files-found: error
          retention-days: 1
