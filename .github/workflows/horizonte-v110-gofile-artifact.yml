name: Horizonte V110 Gofile Artifact Bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'horizonte-v110-gofile-trigger.txt'
      - '.github/workflows/horizonte-v110-gofile-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download GoFile helper
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/martadams89/gofile-dl/main/run.py \
            -o /tmp/gofile_run.py
          python -m pip install --quiet requests pathvalidate curl_cffi

      - name: Download validated V1.10 APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/gofile-out /tmp/gofile-config
          CONFIG_DIR=/tmp/gofile-config python /tmp/gofile_run.py \
            "https://gofile.io/d/rDFERFct" \
            -d /tmp/gofile-out

          APK="$(find /tmp/gofile-out -type f -name 'Horizonte-Artificial-v1.10.0-PFD-test-debug.apk' -print -quit)"
          test -n "$APK"
          echo "c780394705520d1df8138dfba3584b8fbc1be9bcb777719360b804f1d3695b31  $APK" | sha256sum -c -
          test "$(stat -c%s "$APK")" = "162216400"
          cp "$APK" ./Horizonte-Artificial-v1.10.0-PFD-test-debug.apk

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-Artificial-v1.10.0-PFD-test-debug
          path: Horizonte-Artificial-v1.10.0-PFD-test-debug.apk
          if-no-files-found: error
          retention-days: 1
