name: Temporary Horizonte APK Handoff

on:
  push:
    paths:
      - '.github/workflows/temp-horizonte-handoff.yml'
      - 'TEMP_HORIZONTE_V151_APK_URL.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated APK
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://release-assets.githubusercontent.com/github-production-release-asset/1317262216/1b3e15f8-69ac-471e-94c5-f99da75e3e35?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-25T02%3A23%3A37Z&rscd=attachment%3B+filename%3DHorizonte-Artificial-v1.8.0-PFD-test-debug.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-25T01%3A23%3A25Z&ske=2026-09-25T02%3A23%3A37Z&sks=b&skv=2018-11-09&sig=zi%2FLZoHq2BcwUK52IyloHl%2BUGFLNkWfZolKBSLlmvbY%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MDMwMzM5NywibmJmIjoxNzkwMjk5Nzk3LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ._D4tcc4yRahqOzhJ-zlIqyDYbC4UNAkvVV7pvXLus4s&response-content-disposition=attachment%3B%20filename%3DHorizonte-Artificial-v1.8.0-PFD-test-debug.apk&response-content-type=application%2Fvnd.android.package-archive' \
            -o Horizonte-Artificial-v1.8.0-PFD-test-debug.apk
          echo "e0d3ed98d2501336a809c69339d3965c33e0cbb7c033e8688a9cfe4694839ac6  Horizonte-Artificial-v1.8.0-PFD-test-debug.apk" | sha256sum -c -
          test "$(stat -c%s Horizonte-Artificial-v1.8.0-PFD-test-debug.apk)" = "159822626"
          ls -lh Horizonte-Artificial-v1.8.0-PFD-test-debug.apk

      - name: Publish temporary public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="temp-horizonte-v1.8.0-handoff"
          gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes >/dev/null 2>&1 || true
          git tag -d "$TAG" >/dev/null 2>&1 || true
          gh release create "$TAG" \
            Horizonte-Artificial-v1.8.0-PFD-test-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TEMP Horizonte V1.8.0 APK" \
            --notes "Temporary handoff file for ChatGPT transfer."
