name: Temporary Horizonte APK Handoff

on:
  push:
    paths:
      - '.github/workflows/temp-horizonte-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated APK
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://release-assets.githubusercontent.com/github-production-release-asset/1317262216/db7aae22-364d-4821-b95c-6618172f766f?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-25T15%3A06%3A33Z&rscd=attachment%3B+filename%3DHorizonte-Artificial-v1.8.1-PFD-test-debug.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-25T14%3A05%3A48Z&ske=2026-09-25T15%3A06%3A33Z&sks=b&skv=2018-11-09&sig=iY24j6Hz%2FMzBtKE6g9wE%2BA%2FWF%2FKUadx2Cd73XTRaJtI%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MDM0ODkyNCwibmJmIjoxNzkwMzQ1MzI0LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.KLyhaawOemQJEWi9IFtrRLa08Lc9Kbfhyij2yEcU95w&response-content-disposition=attachment%3B%20filename%3DHorizonte-Artificial-v1.8.1-PFD-test-debug.apk&response-content-type=application%2Fvnd.android.package-archive' \
            -o Horizonte-Artificial-v1.8.1-PFD-test-debug.apk
          echo "7e39ca4b020497528dc0bf686f6f6f67a5d5ee59728f8cc7f59f82c2544ef1e7  Horizonte-Artificial-v1.8.1-PFD-test-debug.apk" | sha256sum -c -
          test "$(stat -c%s Horizonte-Artificial-v1.8.1-PFD-test-debug.apk)" = "159823310"

      - name: Publish temporary public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="temp-horizonte-v1.8.1-handoff"
          gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" \
            Horizonte-Artificial-v1.8.1-PFD-test-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TEMP Horizonte V1.8.1 APK" \
            --notes "Temporary handoff file for ChatGPT transfer."
