name: Temp Horizonte V1.8.1 Chat Handoff

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-horizonte-v181-chat.yml'
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download corrected V1.8.1 APK
        run: |
          set -euo pipefail
          URL="https://store3.gofile.io/download/web/00ec7766-f82a-4e7e-89bf-75839bd94a6a/Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk"
          curl -fL --retry 3 \
            -H "Cookie: accountToken=BLzPri9IsnTJtVAEVBKK6uhXfkVu7xqV" \
            "$URL" \
            -o Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk
          echo "1d485fa2ad2f73c45feb6cb5e7ebe3b61f8091e432e2c2868d543c569ed96a13  Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk" | sha256sum -c -
          test "$(stat -c%s Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk)" = "159835506"

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-Artificial-v1.8.1-PFD-corrected-debug
          path: Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk
          if-no-files-found: error
          retention-days: 1
