name: Temp Horizonte V1.8.1 Chat Handoff

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-horizonte-v181-chat.yml'
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Create temporary Gofile download session
        run: |
          set -euo pipefail
          printf 'x' > /tmp/session.txt
          RESP="$(curl -fsS -X POST https://upload.gofile.io/uploadfile -F 'file=@/tmp/session.txt')"
          TOKEN="$(printf '%s' "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["guestToken"])')"
          test -n "$TOKEN"
          echo "GOFILE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Download corrected V1.8.1 APK
        run: |
          set -euo pipefail
          META="$(curl -fsS \
            -H "Authorization: Bearer $GOFILE_TOKEN" \
            "https://api.gofile.io/contents/1707517f-4483-48db-8a2c-88a8412e84a2")"
          printf '%s' "$META" > /tmp/meta.json
          LINK="$(python3 -c "import json; d=json.load(open('/tmp/meta.json')); print(d['data']['children']['00ec7766-f82a-4e7e-89bf-75839bd94a6a']['link'])")"
          test -n "$LINK"
          curl -fL --retry 3 \
            -H "Cookie: accountToken=$GOFILE_TOKEN" \
            "$LINK" \
            -o Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk
          stat -c '%s' Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk
          sha256sum Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk
          echo "1d485fa2ad2f73c45feb6cb5e7ebe3b61f8091e432e2c2868d543c569ed96a13  Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk" | sha256sum -c -
          test "$(stat -c%s Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk)" = "159835506"

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-Artificial-v1.8.1-PFD-corrected-debug
          path: Horizonte-Artificial-v1.8.1-PFD-corrected-debug.apk
          if-no-files-found: error
          retention-days: 1
